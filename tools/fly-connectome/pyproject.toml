[project]
name = "fly-connectome"
version = "0.1.0"
description = "Offline pipeline: MaleCNS v1.0 → visuo-motor subnetwork assets for /mouche-puissance-4"
requires-python = ">=3.12,<3.13"
dependencies = [
    "colour-science>=0.4.7",
    "fast-simplification>=0.2.0",
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy>=1.18.1",
    "trimesh>=5.2.0",
]

[tool.uv]
package = false
# uv-managed CPython ships the headers Brian2 needs to compile its Cython code.
python-preference = "only-managed"

[dependency-groups]
validate = [
    "brian2>=2.10.1",
    "cython>=3.1.3",
    "joblib>=1.6.0",
]
